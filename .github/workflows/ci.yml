name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 12 * * 1"   # weekly: watch for a newer Connect IQ SDK

env:
  SDK_VERSION: "9.2.0"

jobs:
  # Watch the public SDK feed. While the pinned SDK is the latest, the device
  # profiles can't have changed upstream, so this passes instantly (the cheap
  # "is anything even different?" gate). When a newer SDK ships, it FAILS and
  # tells us to refresh profiles + re-check the palette + bump SDK_VERSION.
  # (CI can't fetch the profiles themselves — they're Garmin-auth-gated — so this
  # version signal is the most upstream check possible without a login.)
  sdk-watch:
    name: SDK version watch
    runs-on: ubuntu-22.04
    steps:
      - name: Compare pinned SDK vs latest published
        run: |
          LATEST=$(curl -s https://developer.garmin.com/downloads/connect-iq/sdks/sdks.json | jq -r '.[].version' | sort -V | tail -1)
          echo "pinned=$SDK_VERSION  latest=$LATEST"
          if [ "$LATEST" != "$SDK_VERSION" ]; then
            echo "::error::New Connect IQ SDK $LATEST available (pinned $SDK_VERSION). Refresh device profiles in the SDK Manager, regenerate .ci/devices/edge-devices.zip, run 'make palette-check', then bump SDK_VERSION."
            exit 1
          fi
          echo "SDK stable at $SDK_VERSION — native profiles can't have drifted upstream."

  # Verify each device's hardcoded Palette still matches its committed profile.
  palette-guard:
    name: native palette guard
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Extract device profiles
        run: mkdir -p devices && unzip -q .ci/devices/edge-devices.zip -d devices
      - name: Check palettes vs profiles
        run: python3 tools/check_native_palette.py devices

  build:
    name: build ${{ matrix.device }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        device: [edge540, edge550, edge840, edge850, edge1050, edgeexplore2, edgemtb]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: System deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libwebkit2gtk-4.0-37 libusb-1.0-0 libsm6
      - name: Install Connect IQ SDK
        run: |
          REL=$(curl -s https://developer.garmin.com/downloads/connect-iq/sdks/sdks.json | jq -r ".[] | select(.version==\"$SDK_VERSION\") | .linux")
          wget -q "https://developer.garmin.com/downloads/connect-iq/sdks/$REL" -O /tmp/sdk.zip
          mkdir -p "$HOME/ciq-sdk" && unzip -q /tmp/sdk.zip -d "$HOME/ciq-sdk"
          chmod +x "$HOME/ciq-sdk/bin/"* || true
          echo "$HOME/ciq-sdk/bin" >> "$GITHUB_PATH"
      - name: Install device profiles
        run: |
          mkdir -p "$HOME/.Garmin/ConnectIQ/Devices"
          unzip -q .ci/devices/edge-devices.zip -d "$HOME/.Garmin/ConnectIQ/Devices"
      - name: Generate throwaway dev key
        run: openssl genrsa 4096 2>/dev/null | openssl pkcs8 -topk8 -nocrypt -outform DER -out ci_key.der
      - name: Build Time in Zone
        run: |
          mkdir -p bin
          monkeyc -f monkey.jungle -o bin/TimeInZone-${{ matrix.device }}.prg -d ${{ matrix.device }} -y ci_key.der -l 2
      - name: Build PW:HR
        run: monkeyc -f pwhr.jungle -o bin/PwHr-${{ matrix.device }}.prg -d ${{ matrix.device }} -y ci_key.der -l 2
      - name: Build Aerobic Decoupling
        run: monkeyc -f decoupling.jungle -o bin/PwHrDrift-${{ matrix.device }}.prg -d ${{ matrix.device }} -y ci_key.der -l 2
      - name: Build Time in Power Zone
        run: monkeyc -f tipz.jungle -o bin/TimeInPowerZone-${{ matrix.device }}.prg -d ${{ matrix.device }} -y ci_key.der -l 2
      - name: Build Carb Burn
        run: monkeyc -f carbs.jungle -o bin/CarbBurn-${{ matrix.device }}.prg -d ${{ matrix.device }} -y ci_key.der -l 2
      - name: Compile tests
        run: monkeyc -f monkey.jungle -o bin/test-${{ matrix.device }}.prg -d ${{ matrix.device }} -y ci_key.der -t -l 2
