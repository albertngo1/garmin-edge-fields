name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  SDK_VERSION: "9.2.0"

# Compile-verify the field (and the test target) across every supported Edge
# device. The unit tests themselves run locally via `make tests` — the Connect IQ
# simulator segfaults headless on CI runners, so CI covers cross-device builds +
# that the test code compiles, not test execution.
jobs:
  build:
    name: build ${{ matrix.device }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        device: [edge540, edge550, edge840, edge850, edge1050, edgeexplore2, edgemtb]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: System deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libwebkit2gtk-4.0-37 libusb-1.0-0 libsm6
      - name: Install Connect IQ SDK
        run: |
          REL=$(curl -s https://developer.garmin.com/downloads/connect-iq/sdks/sdks.json | jq -r ".[] | select(.version==\"$SDK_VERSION\") | .linux")
          wget -q "https://developer.garmin.com/downloads/connect-iq/sdks/$REL" -O /tmp/sdk.zip
          mkdir -p "$HOME/ciq-sdk" && unzip -q /tmp/sdk.zip -d "$HOME/ciq-sdk"
          chmod +x "$HOME/ciq-sdk/bin/"* || true
          echo "$HOME/ciq-sdk/bin" >> "$GITHUB_PATH"
      - name: Install device profiles
        run: |
          mkdir -p "$HOME/.Garmin/ConnectIQ/Devices"
          unzip -q .ci/devices/edge-devices.zip -d "$HOME/.Garmin/ConnectIQ/Devices"
      - name: Generate throwaway dev key
        run: openssl genrsa 4096 2>/dev/null | openssl pkcs8 -topk8 -nocrypt -outform DER -out ci_key.der
      - name: Build app
        run: |
          mkdir -p bin
          monkeyc -f monkey.jungle -o bin/TimeInZone-${{ matrix.device }}.prg -d ${{ matrix.device }} -y ci_key.der -l 2
      - name: Compile tests
        run: monkeyc -f monkey.jungle -o bin/test-${{ matrix.device }}.prg -d ${{ matrix.device }} -y ci_key.der -t -l 2
